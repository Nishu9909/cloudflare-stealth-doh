name = "stealth-doh"
main = "src/_worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "BLOCKLIST"
id = "5217322232944d3c880804cbe1b15588"

[[kv_namespaces]]
binding = "ALLOWLIST"
id = "5217322232944d3c880804cbe1b15588"

[vars]
DOH_PATH = "dns-query"
UPSTREAM_URLS = "https://dns.google/dns-query,https://cloudflare-dns.com/dns-query,https://dns.quad9.net/dns-query"
ENABLE_ECS = "true"
CACHE_TTL = "300"
BLOCK_MODE = "nxdomain"   # or "null" for 0.0.0.0 sinkhole

[assets]
directory = "./public"
binding = "ASSETS"
